# Default values for ixy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2
image:
  repository: neoskop/ixy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''
role:
  name: 'distributor'
# develop mode aka hot reloading
develop: false
# App config
config:
  BASE_URL: ''
  CLUSTER_MODE: true
podAnnotations: {}
podLabels: {}
# The image runs as node (1000:1000); the IDs are set explicitly because
# runAsNonRoot cannot verify the named USER of the image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# The ServiceAccount token stays mounted: in cluster mode ixy lists the pods
# of its namespace to find its peers (see role above).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
# readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
resources:
  limits:
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
cache:
  volume:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 1Gi
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}
